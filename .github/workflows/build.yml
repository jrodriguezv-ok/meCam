name: Compilar APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'servidor/**'
      - 'herramientas/**'
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Preparar clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.MECAM_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mecam.p12"
          echo "MECAM_KEYSTORE=$RUNNER_TEMP/mecam.p12" >> "$GITHUB_ENV"
      - name: Compilar
        env:
          MECAM_KEYSTORE_PASSWORD: ${{ secrets.MECAM_KEYSTORE_PASSWORD }}
          MECAM_KEY_ALIAS: ${{ secrets.MECAM_KEY_ALIAS }}
          MECAM_KEY_PASSWORD: ${{ secrets.MECAM_KEY_PASSWORD }}
        shell: bash
        run: gradle assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Resumen de errores
        if: failure()
        run: |
          msg=$(grep -E "^e: |What went wrong|Execution failed|error:|FAILURE" -A4 build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Errores de Gradle::$msg"
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MeCam.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: MeCam - versión ${{ github.run_number }}
          body: "versionCode=${{ github.run_number }}"
          prerelease: true
          files: MeCam.apk
